[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
firebase-admin = "0.3.0"
futures-util = "0.3.31"
gcloud-storage = "1.3.0"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-webpki", "uuid"] }
time = { version = "0.3.47", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
