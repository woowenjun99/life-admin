TCPSocket 3310
# This target is published only to 127.0.0.1 on the host by compose.yaml.
# Binding the container interface lets Docker forward that host-only port.
TCPAddr 0.0.0.0

User clamav
DatabaseDirectory /var/lib/clamav
LogTime yes
Foreground yes

# The application accepts files up to 10 MiB. Leave scanner headroom above that
# transport limit while keeping memory and CPU bounds explicit.
StreamMaxLength 12M
MaxFileSize 12M
MaxScanSize 25M
