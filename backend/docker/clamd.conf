TCPSocket 3310
TCPAddr 127.0.0.1

User clamav
DatabaseDirectory /var/lib/clamav
LogTime yes
Foreground yes

# The application accepts files up to 10 MiB. Leave scanner headroom above that
# transport limit while keeping memory and CPU bounds explicit.
StreamMaxLength 12M
MaxFileSize 12M
MaxScanSize 25M
